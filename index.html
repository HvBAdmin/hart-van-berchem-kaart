);margin-top:8px}.hvb-pin{background:var(--red);color:#fff;border:2px solid #fff;border-radius:50% 50% 50% 0;width:34px;height:34px;display:grid;place-items:center;transform:rotate(-45deg);box-shadow:0 2px 8px #0004}.hvb-pin span{transform:rotate(45deg);font-size:16px}.hvb-pop a{display:inline-block;background:var(--red);color:#fff!important;text-decoration:none;padding:8px 11px;border-radius:8px;font-weight:700;font-size:12px}@media(max-width:760px){.hvb-count{display:none}.hvb-layout{grid-template-columns:1fr}.hvb-map{height:440px}.hvb-list{height:auto;max-height:430px}.hvb-search{max-width:none}}

async function geo(s){let addr=s.name==="Apotheek DrieKoningen"?"Grotesteenweg 107":s.address,q=encodeURIComponent(addr+", 2600 Berchem, Antwerpen, België");try{let r=await fetch("https://photon.komoot.io/api/?limit=1&q="+q),d=await r.json();if(d.features&&d.features[0]){let c=d.features[0].geometry.coordinates;return[c[1],c[0]]}}catch(e){}return null}
async function init(){filters();render();$("hvbSearch").oninput=e=>{query=e.target.value.trim().toLowerCase();render()};let i=0,done=0;async function worker(){while(i<shops.length){let s=shops[i++],p=await geo(s);if(p){let ic=L.divIcon({className:"",html:'<div class="hvb-pin"><span>'+icons[s.cat]+'</span></div>',iconSize:[34,34],iconAnchor:[17,34]}),route="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(s.address+", 2600 Berchem, België"),m=L.marker(p,{icon:ic}).bindPopup('<div class="hvb-pop"><strong>'+s.name+'</strong><p>'+icons[s.cat]+' '+labels[s.cat]+'<br>'+s.address+', 2600 Berchem</p><a href="'+route+'" target="_blank">Route →</a></div>').addTo(map);markers.set(s.id,m)}done++;$("hvbStatus").textContent="Kaartlocaties laden: "+done+"/"+shops.length}}await Promise.all(Array.from({length:6},worker));render();$("hvbStatus").textContent=markers.size+" handelaars op de kaart.";if(markers.size)map.fitBounds(L.featureGroup([...markers.values()]).getBounds().pad(.08),{maxZoom:16})}init();
