<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hart van Berchem - Handelaars</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body style="margin:0">
<div id="hvb-map-app"><div class="hvb-head"><div><h2>Ontdek onze handelaars</h2><p>Zoek op naam of kies een categorie.</p></div><div class="hvb-count"><strong id="hvbCount">62</strong><span>handelaars</span></div></div><div class="hvb-toolbar"><label class="hvb-search"><span>⌕</span><input id="hvbSearch" type="search" placeholder="Zoek een handelaar…" autocomplete="off"></label><div id="hvbFilters" class="hvb-filters"></div></div><div class="hvb-layout"><div id="hvbMap" class="hvb-map"></div><div id="hvbList" class="hvb-list"></div></div><div id="hvbStatus" class="hvb-status">Handelaars laden…</div></div>
<style>
#hvb-map-app{--red:#c51f2f;--ink:#171717;--muted:#6d6d6d;--line:#e5e5e5;--soft:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:var(--ink);max-width:1200px;margin:auto;padding:18px}#hvb-map-app *{box-sizing:border-box}.hvb-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:0 0 18px}.hvb-head h2{font-size:clamp(26px,4vw,42px);line-height:1;margin:0 0 8px;font-weight:800}.hvb-head p{margin:0;color:var(--muted)}.hvb-count{display:flex;gap:7px;align-items:baseline}.hvb-count strong{font-size:28px;color:var(--red)}.hvb-count span{color:var(--muted);font-size:13px}.hvb-search{height:48px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;padding:0 15px;background:#fff;max-width:430px}.hvb-search span{font-size:25px;margin-right:8px}.hvb-search input{border:0;outline:0;width:100%;font-size:16px}.hvb-filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}.hvb-filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:13px;cursor:pointer}.hvb-filter.active{border-color:var(--red);background:var(--red);color:#fff}.hvb-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:14px}.hvb-map{height:600px;border-radius:18px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}.hvb-list{height:600px;overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}.hvb-card{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:15px 16px;cursor:pointer;display:grid;grid-template-columns:42px 1fr;gap:11px}.hvb-card:hover{background:var(--soft)}.hvb-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f1f1f1;font-size:20px}.hvb-card strong{display:block;font-size:15px;margin:2px 0 4px}.hvb-card small{display:block;color:var(--muted);line-height:1.35}.hvb-cat{color:var(--red)!important;font-weight:700}.hvb-status{font-size:12px;color:var(--muted);margin-top:8px}.hvb-pin{background:var(--red);color:#fff;border:2px solid #fff;border-radius:50% 50% 50% 0;width:34px;height:34px;display:grid;place-items:center;transform:rotate(-45deg);box-shadow:0 2px 8px #0004}.hvb-pin span{transform:rotate(45deg);font-size:16px}.hvb-pop a{display:inline-block;background:var(--red);color:#fff!important;text-decoration:none;padding:8px 11px;border-radius:8px;font-weight:700;font-size:12px}@media(max-width:760px){.hvb-count{display:none}.hvb-layout{grid-template-columns:1fr}.hvb-map{height:440px}.hvb-list{height:auto;max-height:430px}.hvb-search{max-width:none}}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let shops=[];
const icons={horeca:"🍴",voeding:"🛒",beauty:"✦",bloemen:"❀",kleding:"👕",geschenken:"🎁",accessoires:"👜","vrije tijd":"★",schoenen:"👟",wonen:"⌂",diensten:"⚙",overige:"●"};
const labels={horeca:"Horeca",voeding:"Voeding",beauty:"Beauty & gezondheid",bloemen:"Bloemen",kleding:"Kleding",geschenken:"Geschenken",accessoires:"Accessoires","vrije tijd":"Vrije tijd",schoenen:"Schoenen",wonen:"Wonen & decoratie",diensten:"Diensten",overige:"Overige"};
let active="alle",query="",markers=new Map();
const $=x=>document.getElementById(x);
const map=L.map("hvbMap",{scrollWheelZoom:false}).setView([51.1965,4.423],15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap-bijdragers"}).addTo(map);
function visible(s){return(active==="alle"||s.cats.includes(active))&&(!query||s.name.toLowerCase().includes(query)||s.address.toLowerCase().includes(query))}
function render(){
 const a=shops.filter(visible);$("hvbCount").textContent=a.length;
 $("hvbList").innerHTML=a.map(s=>'<button class="hvb-card" data-id="'+s.id+'"><span class="hvb-icon">'+icons[s.cat]+'</span><span><strong>'+s.name+'</strong><small class="hvb-cat">'+s.cats.map(c=>labels[c]).join(" · ")+'</small><small>'+s.address+', 2600 Berchem</small></span></button>').join("");
 document.querySelectorAll(".hvb-card").forEach(b=>b.onclick=()=>focus(+b.dataset.id));
 markers.forEach((m,id)=>visible(shops[id])?m.addTo(map):map.removeLayer(m));
}
function focus(id){const m=markers.get(id);if(m){map.setView(m.getLatLng(),17);m.openPopup()}}
function filters(){
 const cs=[...new Set(shops.flatMap(s=>s.cats))];
 $("hvbFilters").innerHTML='<button class="hvb-filter active" data-cat="alle">Alle</button>'+cs.map(c=>'<button class="hvb-filter" data-cat="'+c+'">'+icons[c]+' '+labels[c]+'</button>').join("");
 document.querySelectorAll(".hvb-filter").forEach(b=>b.onclick=()=>{active=b.dataset.cat;document.querySelectorAll(".hvb-filter").forEach(x=>x.classList.toggle("active",x===b));render()});
}
async function init(){
 try{
  const data=await fetch("leden.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error();return r.json()});
  shops=data.map((x,i)=>({id:i,name:x.name,address:x.address,cats:x.categories,cat:x.categories[0],lat:x.lat,lng:x.lng}));
  filters();render();$("hvbSearch").oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
  for(const s of shops){
   const ic=L.divIcon({className:"",html:'<div class="hvb-pin"><span>'+icons[s.cat]+'</span></div>',iconSize:[34,34],iconAnchor:[17,34]});
   const route="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(s.address+", 2600 Berchem, België");
   const m=L.marker([s.lat,s.lng],{icon:ic}).bindPopup('<div class="hvb-pop"><strong>'+s.name+'</strong><p>'+s.cats.map(c=>icons[c]+" "+labels[c]).join(" · ")+'<br>'+s.address+', 2600 Berchem</p><a href="'+route+'" target="_blank" rel="noopener">Route →</a></div>').addTo(map);
   markers.set(s.id,m);
  }
  render();$("hvbStatus").textContent=shops.length+" handelaars op de kaart.";
  if(markers.size)map.fitBounds(L.featureGroup([...markers.values()]).getBounds().pad(.08),{maxZoom:16});
 }catch(e){$("hvbStatus").textContent="De ledengegevens konden niet geladen worden."}
}
init();
</script></body></html>
